---
name: CI

"on":
  push:
    branches:
      - "*"
  pull_request:
  schedule:
    - cron: 0 0 * * 0

permissions: read-all

env:
  # The NetBox release of the unit-test jobs and of the branching browser job. Keep it equal to
  # QUERY_COUNT_NETBOX_VERSION in netbox_kea/tests/conftest.py.
  NETBOX_RELEASE: v4.7.0
  # The netbox-branching release of the branching jobs; tests/docker/docker-compose.branching.yml reads it.
  NETBOX_BRANCHING_VERSION: 1.2.1

jobs:
  unit-test:
    runs-on: ubuntu-latest

    services: &netbox-test-services
      postgres:
        image: postgres:16@sha256:adac386a3163424d8397b51b950187eaa661013020a1b9e0d5437a9752040f80
        env:
          POSTGRES_USER: netbox
          POSTGRES_PASSWORD: netbox
          POSTGRES_DB: netbox
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7@sha256:d7fcf65186e011faaa401b5e6edf5147e9dd01353984c795e515f6fee7dfbe6e
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - &checkout-repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - &checkout-netbox
        name: Checkout NetBox
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: netbox-community/netbox
          ref: ${{ env.NETBOX_RELEASE }}
          path: netbox
          persist-credentials: false

      - &setup-uv
        name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - &setup-python
        name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install dependencies
        run: |
          uv export --native-tls --frozen --only-group dev --no-emit-project --format requirements-txt | \
            uv pip install --native-tls --system -r /dev/stdin
          uv pip install --native-tls --system -r netbox/requirements.txt
          uv pip install --native-tls --system -e .

      - name: Set up NetBox configuration
        working-directory: netbox/netbox
        run: |
          python "${{ github.workspace }}/scripts/write_netbox_ci_configuration.py" \
            --output netbox/configuration.py --plugin netbox_kea

      - name: Run unit tests with coverage
        working-directory: netbox/netbox
        env:
          TEST_DB_NAME: test_netbox_kea_ci
          TEST_REDIS_HOST: localhost
        run: |
          pytest ${{ github.workspace }}/netbox_kea/tests/ \
            --override-ini="DJANGO_SETTINGS_MODULE=netbox_kea.tests.isolated_settings" \
            --override-ini="pythonpath=${{ github.workspace }}/netbox/netbox" \
            -n auto \
            --dist loadscope \
            --reuse-db \
            --cov=netbox_kea \
            --cov-config=${{ github.workspace }}/pyproject.toml \
            --cov-report=xml:${{ github.workspace }}/coverage.xml \
            --no-header -q

      - &upload-coverage
        name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5  # v7.1.1
        with:
          files: ./coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  dhcp-plugin-test:
    runs-on: ubuntu-latest

    services: *netbox-test-services

    steps:
      - *checkout-repository
      - *checkout-netbox
      - *setup-uv
      - *setup-python

      - name: Install dependencies with the supported DHCP plugin
        run: |
          uv export --native-tls --frozen --only-group dev --no-emit-project --format requirements-txt | \
            uv pip install --native-tls --system -r /dev/stdin
          uv pip install --native-tls --system -r netbox/requirements.txt
          uv pip install --native-tls --system -e . "netbox-plugin-dhcp==0.2.0"

      - name: Set up NetBox configuration
        working-directory: netbox/netbox
        run: |
          python "${{ github.workspace }}/scripts/write_netbox_ci_configuration.py" \
            --output netbox/configuration.py --plugin netbox_kea --plugin netbox_dhcp

      - name: Run DHCP plugin adapter tests
        working-directory: netbox/netbox
        env:
          TEST_DB_NAME: test_netbox_kea_dhcp_plugin_ci
          TEST_REDIS_HOST: localhost
        run: |
          pytest ${{ github.workspace }}/netbox_kea/tests/test_integration_dhcp_plugin.py \
            --override-ini="DJANGO_SETTINGS_MODULE=netbox_kea.tests.isolated_settings" \
            --override-ini="pythonpath=${{ github.workspace }}/netbox/netbox" \
            -n 1 \
            --maxschedchunk=1 \
            --reuse-db \
            --no-header -q

  branching-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    services: *netbox-test-services

    steps:
      - *checkout-repository
      - *checkout-netbox
      - *setup-uv
      - *setup-python

      - name: Install dependencies with netbox-branching and the supported DHCP plugin
        run: |
          uv export --native-tls --frozen --only-group dev --no-emit-project --format requirements-txt | \
            uv pip install --native-tls --system -r /dev/stdin
          uv pip install --native-tls --system -r netbox/requirements.txt
          uv pip install --native-tls --system -e . \
            "netbox-plugin-dhcp==0.2.0" "netboxlabs-netbox-branching==${NETBOX_BRANCHING_VERSION}"

      - name: Set up NetBox configuration
        working-directory: netbox/netbox
        run: |
          python "${{ github.workspace }}/scripts/write_netbox_ci_configuration.py" \
            --output netbox/configuration.py --plugin netbox_kea --plugin netbox_dhcp --branching

      # NETBOX_KEA_REQUIRE_BRANCHING=1 makes test_branching.py fail, not skip, without netbox-branching.
      - name: Run netbox-branching tests
        working-directory: netbox/netbox
        env:
          TEST_DB_NAME: test_netbox_kea_branching_ci
          TEST_REDIS_HOST: localhost
          NETBOX_KEA_REQUIRE_BRANCHING: "1"
        run: |
          pytest ${{ github.workspace }}/netbox_kea/tests/test_branching.py \
            --override-ini="DJANGO_SETTINGS_MODULE=netbox_kea.tests.isolated_settings" \
            --override-ini="pythonpath=${{ github.workspace }}/netbox/netbox" \
            -n auto \
            --maxschedchunk=1 \
            --reuse-db \
            --cov=netbox_kea \
            --cov-config=${{ github.workspace }}/pyproject.toml \
            --cov-report=xml:${{ github.workspace }}/coverage.xml \
            --no-header -q

      # Only this job runs the netbox-branching code paths; Codecov merges this report with the unit-test one.
      - *upload-coverage

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Before the venv exists, so the glob cannot reach a dependency's own Markdown.
      # --offline checks the links that live in this repository and skips every URL,
      # which keeps the job independent of whether an external site is up.
      - name: Documentation links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8  # v2.9.0
        with:
          args: "--offline --no-progress './**/*.md'"
          # Outside the checkout: the summary file carries no SPDX header, and the
          # REUSE step later in this job reads everything the workspace holds.
          output: ${{ runner.temp }}/lychee.md

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: pyproject.toml

      - name: Install dev dependencies
        run: uv sync --native-tls --group dev

      - name: Ruff lint
        run: uv run --native-tls ruff check .

      - name: Ruff format check
        run: uv run --native-tls ruff format --check .

      - name: Type check (mypy, new errors only)
        run: uv run --native-tls scripts/mypy-gate.sh

      - name: REUSE compliance
        run: uv run --native-tls reuse lint

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Bracket the support window (floor + ceiling) plus dev, rather than every
          # minor. NetBox can break at minors, but the ends keep the middle low-risk
          # while cutting CI cost; bump the ceiling when a new stable ships.
          - netbox: v4.3        # floor — minimum supported NetBox
          - netbox: v4.7        # ceiling — latest stable NetBox
          # NetBox develop branch (unreleased "main"); allowed to fail so upstream
          # churn gives early signal without blocking merges (see continue-on-error).
          - netbox: snapshot
            experimental: true

    runs-on: ubuntu-latest
    # Only the experimental (develop/"main") leg may fail without failing the job.
    continue-on-error: ${{ matrix.experimental || false }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          enable-cache: true

      - &setup-browser-python
        name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          # Pin the test-driver Python to the 3.14 line (tracks the latest 3.14.x patch —
          # minor-line, not an exact patch). Without this, reading requires-python (">=3.10")
          # lets setup-python float to whatever release is newest. This only runs the
          # black-box test client (playwright/API); NetBox runs in its container on its own
          # bundled Python, so it is not tied to any matrix leg.
          python-version: "3.14"

      - &install-playwright
        name: Ensure playwright browsers are installed
        # --with-deps runs apt-get update, which fails the job on any broken source the
        # runner image carries. Playwright downloads its own Chromium, so Google's Chrome
        # repository is never needed here and its outages must not reach this suite.
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          uv run --native-tls playwright install --with-deps

      - &build-wheel
        name: Run uv build
        run: uv build --native-tls

      - name: Run test_setup.sh
        run: ./tests/test_setup.sh
        env:
          NETBOX_CONTAINER_TAG: ${{ matrix.netbox }}

      - name: Run pytest
        run: |
          uv run --native-tls pytest tests/ -p no:django --tracing=retain-on-failure -v

      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces-${{ matrix.netbox }}
          path: test-results/
          retention-days: 90

      - &show-docker-logs
        name: Show Docker logs
        if: ${{ always() }}
        run: docker compose logs
        working-directory: ./tests/docker/

  # The integration job's steps on the netbox-branching variant of the harness. netbox-branching
  # supports NetBox 4.7 only, so this job runs one NetBox release and only the branching browser tests.
  branching-browser-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.override.yml:docker-compose.branching.yml
    steps:
      - *checkout-repository
      - *setup-uv
      - *setup-browser-python
      - *install-playwright
      - *build-wheel

      - name: Run test_setup.sh
        run: ./tests/test_setup.sh
        env:
          NETBOX_CONTAINER_TAG: ${{ env.NETBOX_RELEASE }}

      # NETBOX_KEA_REQUIRE_BRANCHING=1 makes the module fail, not skip, without netbox-branching.
      - name: Run the branching browser tests
        env:
          NETBOX_KEA_REQUIRE_BRANCHING: "1"
        run: |
          uv run --native-tls pytest tests/ui/test_branching_refusal.py -p no:django --tracing=retain-on-failure -v

      - name: Upload Playwright traces
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces-branching
          path: test-results/
          retention-days: 90

      - *show-docker-logs
