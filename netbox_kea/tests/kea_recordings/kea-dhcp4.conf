{
  "Dhcp4": {
    "interfaces-config": {"interfaces": []},
    "control-sockets": [{"socket-type": "http", "socket-address": "0.0.0.0", "socket-port": 8000}],
    "lease-database": {"type": "memfile", "persist": false},
    "hooks-libraries": [{"library": "/usr/lib/kea/hooks/libdhcp_subnet_cmds.so"}],
    "client-classes": [{"name": "voip"}, {"name": "printers", "only-in-additional-list": true}],
    "option-def": [
      {"name": "tftp-list", "code": 224, "space": "dhcp4", "type": "ipv4-address", "array": true},
      {"name": "vendor-record", "code": 225, "space": "dhcp4", "type": "record", "record-types": "uint8, string"},
      {"name": "vendor-container", "code": 226, "space": "dhcp4", "type": "empty", "encapsulate": "vendor-sub"},
      {"name": "sub-one", "code": 1, "space": "vendor-sub", "type": "string"}
    ],
    "option-data": [
      {"name": "domain-name-servers", "data": "192.0.2.53, 192.0.2.54"},
      {"code": 42, "data": "192.0.2.123", "always-send": true},
      {"name": "domain-name", "data": "example.org", "never-send": false},
      {"name": "tftp-list", "data": "192.0.2.69, 192.0.2.70"},
      {"name": "vendor-record", "data": "1, hello"},
      {"name": "sub-one", "space": "vendor-sub", "data": "nested"},
      {"name": "vendor-container"},
      {"name": "routers", "data": "192.0.2.1", "client-classes": ["voip"]},
      {"code": 150, "data": "C0000245", "csv-format": false}
    ],
    "valid-lifetime": 4000,
    "renew-timer": 1000,
    "rebind-timer": 2000,
    "subnet4": [
      {
        "id": 10,
        "subnet": "192.0.2.0/24",
        "pools": [{"pool": "192.0.2.10 - 192.0.2.20"}, {"pool": "192.0.2.64/26"}],
        "option-data": [{"name": "routers", "data": "192.0.2.1"}],
        "valid-lifetime": 3600,
        "min-valid-lifetime": 1800,
        "max-valid-lifetime": 7200,
        "offer-lifetime": 60,
        "renew-timer": 900,
        "rebind-timer": 1800,
        "allocator": "random",
        "ddns-qualifying-suffix": "",
        "client-classes": ["voip"],
        "evaluate-additional-classes": ["printers"],
        "relay": {"ip-addresses": ["198.51.100.1"]},
        "interface": "eth0"
      }
    ],
    "shared-networks": [
      {
        "name": "office",
        "interface": "eth0",
        "relay": {"ip-addresses": ["198.51.100.2", "198.51.100.3"]},
        "option-data": [{"code": 6, "data": "198.51.100.53"}],
        "subnet4": [
          {"id": 20, "subnet": "198.51.100.0/25", "pools": [{"pool": "198.51.100.10 - 198.51.100.50"}]},
          {"id": 21, "subnet": "198.51.100.128/25", "ddns-qualifying-suffix": "office.example.org."}
        ]
      },
      {"name": "empty-network"}
    ]
  }
}
