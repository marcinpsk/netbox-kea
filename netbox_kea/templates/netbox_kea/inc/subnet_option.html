{% if option.ambiguous %}<span class="text-nowrap">{{ label }}: <span class="badge text-bg-warning" data-bs-toggle="tooltip" title="More than one DHCP Option entry fits this field, so the table does not choose one. Edit the DHCP Options of the Subnet.">Ambiguous</span></span>{% else %}<span class="text-nowrap" data-bs-toggle="tooltip" title="{{ title }}">{{ label }}: {{ option.data }}</span>{% endif %}
