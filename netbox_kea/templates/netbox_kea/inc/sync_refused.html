{# A disabled button gets no mouse events, so the focusable wrapper carries the tooltip. #}
<span class="d-inline-block" tabindex="0" title="{{ reason }}"><button type="button" class="{{ button_class }}" disabled><i class="mdi {{ icon }}" aria-hidden="true"></i> {{ label }}</button><span class="visually-hidden"> {{ reason }}</span></span>
