repos:
  # General file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # Python code quality. Run through uv so the version comes from uv.lock, the same
      # place CI resolves it. A pinned rev here would be a second source that dependabot
      # never updates, so every bump would land with the two gates on different ruff
      # versions. pyproject [dependency-groups].dev plus uv.lock is the only source;
      # test_lint_pins.py holds that. `force-exclude` is on in pyproject, so the
      # filenames pre-commit passes still honour the exclude list.
      - id: ruff-check
        name: ruff check
        entry: uv run --native-tls ruff check --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run --native-tls ruff format
        language: system
        types_or: [python, pyi]
        require_serial: true

      # In-house test-quality guard: flag new spec-less MagicMock/Mock used as object
      # stand-ins (see netbox_kea/tests/mock_discipline.py). Stdlib-only; scans the whole
      # netbox_kea/tests/ tree. Existing usages are grandfathered in the baseline file.
      - id: mock-discipline
        name: mock-discipline (no new spec-less MagicMock/Mock)
        entry: python3 netbox_kea/tests/mock_discipline.py
        language: system
        pass_filenames: false
        files: ^netbox_kea/tests/.*\.py$

  # Type-check netbox_kea and fail only on errors absent from mypy-baseline.txt.
  # Runs on pre-push (not every commit) because a cold mypy cache takes ~20s. CI runs
  # the same script in the lint job, so both gates share one definition.
  - repo: local
    hooks:
      - id: mypy-gate
        name: mypy (new type errors only)
        entry: uv run --native-tls scripts/mypy-gate.sh
        language: system
        pass_filenames: false
        stages: [pre-push]
        # No types filter: the gate reads the whole package, so a push that changes only
        # mypy-baseline.txt or the mypy config must still run it.
        always_run: true

  # Conventional commit message validation
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert]

  # REUSE/SPDX compliance
  - repo: local
    hooks:
      - id: reuse-lint
        name: REUSE Compliance (SPDX headers)
        entry: reuse lint
        language: python
        additional_dependencies: [reuse]
        pass_filenames: false

  # Custom opengrep ruleset (.opengrep/kea-rules.yaml): enforce AGENTS.md
  # security/correctness invariants at pre-commit and scan the whole package.
  # Run for Python changes and changes to the rules or hook configuration. Requires
  # opengrep (https://github.com/opengrep/opengrep) on PATH or at
  # ~/.local/opt/opengrep/bin; set OPENGREP_BIN to override the binary location.
  - repo: local
    hooks:
      - id: opengrep
        name: opengrep (custom Kea rules)
        entry: scripts/opengrep-scan.sh
        language: script
        pass_filenames: false
        stages: [pre-commit]
        files: (\.pyi?$|^\.opengrep/|^scripts/opengrep-.*\.sh$|^\.pre-commit-config\.yaml$)

# Configuration
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]
fail_fast: false
