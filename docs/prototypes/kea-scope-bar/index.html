const icon=(name)=>`<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="${icons[name]||icons.grid}"/></svg>`;
const esc=(s)=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const servers=[{id:'a',name:'demo-core-a',site:'Example campus',families:[4,6],up:true,sync:'2 minutes ago'},{id:'b',name:'demo-core-b',site:'Example campus',families:[4,6],up:true,sync:'3 minutes ago'},{id:'c',name:'demo-edge',site:'Example branch',families:[4],up:true,sync:'5 minutes ago'},{id:'d',name:'demo-lab',site:'Example lab',families:[4,6],up:false,sync:'Unavailable'}];
const subnetData=[{server:'a',id:10,v:4,cidr:'198.18.10.0/24',network:'campus-clients',pools:'198.18.10.50 – 198.18.10.200',used:92,total:151,description:'Workstations'},{server:'a',id:20,v:4,cidr:'198.18.20.0/24',network:'campus-services',pools:'198.18.20.50 – 198.18.20.200',used:43,total:151,description:'Services'},{server:'b',id:10,v:4,cidr:'198.18.10.0/24',network:'campus-clients',pools:'198.18.10.50 – 198.18.10.200',used:87,total:151,description:'Workstations'},{server:'b',id:30,v:4,cidr:'198.18.30.0/24',network:'campus-guest',pools:'198.18.30.50 – 198.18.30.200',used:118,total:151,description:'Guest clients'},{server:'c',id:40,v:4,cidr:'198.19.40.0/24',network:'branch-clients',pools:'198.19.40.50 – 198.19.40.200',used:32,total:151,description:'Branch clients'},{server:'a',id:110,v:6,cidr:'2001:db8:10::/64',network:'campus-clients',pools:'2001:db8:10::100 – ::1ff',used:61,total:256,description:'Workstations'},{server:'a',id:120,v:6,cidr:'2001:db8:20::/64',network:'campus-services',pools:'2001:db8:20::100 – ::1ff',used:25,total:256,description:'Services'},{server:'b',id:110,v:6,cidr:'2001:db8:10::/64',network:'campus-clients',pools:'2001:db8:10::100 – ::1ff',used:59,total:256,description:'Workstations'}];
const names=['workstation-01','printer-02','phone-03','workstation-04','camera-05','workstation-06','printer-07','sensor-08'];
const leaseData=servers.filter(s=>s.up).flatMap(s=>s.families.flatMap(v=>names.map((name,i)=>({server:s.id,v,ip:v===4?`198.${s.id==='c'?19:18}.${s.id==='c'?40:10}.${55+i}`:`2001:db8:10::${105+i}`,name:name+'.example',mac:`02:00:00:00:0${servers.indexOf(s)}:${String(i+10).padStart(2,'0')}`,state:i===7?'Declined':'Active',reserved:i===1||i===6,subnet:v===4?(s.id==='c'?40:10):110,expires:i===7?'Not applicable':`${2+i} hours`,ipam:i%3===0?'Not synced':'In NetBox'}))));
const resources=[['overview','Overview','grid'],['leases','Leases','clock'],['subnets','Subnets','network'],['reservations','Reservations','bookmark'],['configuration','Configuration','settings'],['sync','Sync','refresh']];
const variants={A:'Scope bar',B:'Server rail',C:'Server first'};
let state={},returnScope=null,toastTimer;
function readState(){const p=new URLSearchParams(location.search);let scope=(p.get('scope')||'all').split(',').filter(x=>servers.some(s=>s.id===x));state={variant:['A','B','C'].includes(p.get('variant'))?p.get('variant'):'A',scope:scope.length&&scope.length<4?scope.join(','):'all',resource:resources.some(r=>r[0]===p.get('section'))||['inventory','jobs'].includes(p.get('section'))?p.get('section'):'overview',family:p.get('family')==='6'?6:4,sub:p.get('sub')||'',q:p.get('q')||'',status:p.get('status')||'',detail:p.get('detail')||''};}
function url(change={}){const s={...state,...change},p=new URLSearchParams();p.set('variant',s.variant);p.set('scope',s.scope);p.set('section',s.resource);p.set('family',s.family);if(s.sub)p.set('sub',s.sub);if(s.q)p.set('q',s.q);if(s.status)p.set('status',s.status);if(s.detail)p.set('detail',s.detail);return location.pathname+'?'+p.toString();}
function nav(change={},replace=false){history[replace?'replaceState':'pushState']({},'',url(change));readState();render();}
const link=(label,change={},cls='',attrs='')=>`<a href="${esc(url(change))}" class="${cls}" data-nav ${attrs}>${label}</a>`;
function selected(){return state.scope==='all'?servers:servers.filter(s=>state.scope.split(',').includes(s.id));}
function single(){const a=selected();return a.length===1?a[0]:null;}
function scopeName(){const s=single();return s?s.name:state.scope==='all'?'All servers':selected().map(s=>s.name).join(' + ');}
function scopeShort(){return single()?single().name:state.scope==='all'?'All servers':`${selected().length} selected servers`;}
function scopedData(data){return data.filter(d=>selected().some(s=>s.id===d.server)&&d.v===state.family);}
function familyLinks(){return `<div class="protocol" aria-label="DHCP protocol">${[4,6].map(v=>link(`DHCPv${v}`,{family:v,detail:'',q:'',status:''},state.family===v?'active':'',state.family===v?'aria-current="true"':'')).join('')}</div>`;}
function statusBadge(s){return `<span class="badge ${s.up?'good':'bad'}"><span class="dot ${s.up?'':'down'}"></span>${s.up?'Reachable':'Unreachable'}</span>`;}
function openServer(id,resource=state.resource,detail=''){if(!single())returnScope={...state};nav({scope:id,resource,detail,sub:resource===state.resource?state.sub:'',q:'',status:''});}
function serverLink(s,resource=state.resource,label=s.name,detail=''){return `<a href="${esc(url({scope:s.id,resource,detail,q:'',status:''}))}" data-server="${s.id}" data-section="${resource}" data-detail="${esc(detail)}">${label}</a>`;}
function owner(id,resource=state.resource){const s=servers.find(x=>x.id===id);return serverLink(s,resource,`<span class="owner">${icon('server')}${s.name}</span>`);}
function scopeBar(){const s=single();return `<div class="scope-bar ${s?'':'multi'}"><div class="scope-wrap"><div class="scope-eyebrow">${s?'Working on one server':'Browsing across servers'}</div><button class="scope-trigger" data-action="scope" aria-expanded="false" aria-controls="scope-menu">${icon(s?'server':'layers')}<strong>${scopeShort()}</strong>${icon('chevron')}</button><div class="scope-menu" id="scope-menu" hidden><h3>Choose your scope</h3><p class="small muted" style="margin-top:4px">One server opens its own workspace.</p><input class="search" id="server-search" placeholder="Find a server…" aria-label="Find a server"><label class="scope-option"><input type="checkbox" id="scope-all" ${state.scope==='all'?'checked':''}><strong>All servers</strong><span class="spacer"></span><span class="badge">4</span></label><div style="border-top:1px solid var(--border);margin:5px 0"></div>${servers.map(s=>`<label class="scope-option" data-scope-option="${s.name}"><input type="checkbox" name="scope-choice" value="${s.id}" ${selected().some(x=>x.id===s.id)?'checked':''}><span class="dot ${s.up?'':'down'}"></span><span>${s.name}<span class="muted small" style="display:block">${s.families.map(v=>'DHCPv'+v).join(' · ')}</span></span></label>`).join('')}<footer><span class="small muted" id="selection-count">${selected().length} selected</span><button class="btn primary small" data-action="apply-scope">Apply scope</button></footer></div></div><div class="scope-detail">${s?`<b>${s.site}</b><br>${s.up?'Server connection available':'Server connection unavailable'}`:`<b>${state.scope==='all'?'4 configured servers':esc(selected().map(s=>s.name).join(', '))}</b><br>Open a server to manage its data`}</div><div class="spacer"></div><div><div class="scope-eyebrow">Protocol</div>${familyLinks()}</div></div>`;}
function tabs(){return `<nav class="tabs" aria-label="Kea sections">${resources.map(([id,name])=>link(name,{resource:id,sub:'',q:'',status:'',detail:''},state.resource===id?'active':'',state.resource===id?'aria-current="page"':'')).join('')}</nav>`;}
function partialNotice(){const a=selected().filter(s=>s.families.includes(state.family)),bad=a.filter(s=>!s.up),unsupported=selected().filter(s=>!s.families.includes(state.family));return `${bad.length?`<div class="notice">${icon('alert')}<span><strong>Partial data: ${a.length-bad.length} of ${a.length} DHCPv${state.family} servers responded.</strong> ${bad.map(s=>serverLink(s,'overview')).join(', ')} is unreachable. Counts include responding servers only.</span></div>`:''}${unsupported.length&&!single()?`<div class="small muted" style="margin:-6px 0 15px">${unsupported.map(s=>s.name).join(', ')} has no DHCPv${state.family} service and is excluded from these results.</div>`:''}`;}
function unavailable(){const s=single();if(!s)return '';if(!s.families.includes(state.family))return `<div class="panel empty">${icon('info')}<h2>DHCPv${state.family} is not enabled on ${s.name}</h2><p>Your server selection is unchanged. This server provides DHCPv${s.families[0]} only.</p>${link(`Open DHCPv${s.families[0]}`,{family:s.families[0],detail:''},'btn primary')}</div>`;if(!s.up)return `<div class="panel empty">${icon('alert')}<h2>${s.name} is unreachable</h2><p>Live DHCPv${state.family} data is unavailable. Previously observed data is not shown as current.</p><button class="btn" data-action="retry">${icon('refresh')}Retry connection</button> ${link('Server settings',{resource:'configuration',sub:'connection',detail:''},'btn')}</div>`;return '';}
function sectionHead(title,description,actions=''){return `<div class="content-heading"><div><h2>${title}</h2><p>${description}</p></div><div class="spacer"></div>${actions}</div>`;}
function serverTable(picker=false,inventory=false){return `<div class="table-wrap"><table><thead><tr><th>Server</th><th>Connection</th><th>Protocols</th><th>${picker?'Availability':'Subnets · DHCPv'+state.family}</th><th>${picker?'':'Last IPAM sync'}</th><th class="right">${picker?'Open server view':'Actions'}</th></tr></thead><tbody>${selected().map(s=>{const supported=s.families.includes(state.family);return `<tr><td><strong>${serverLink(s,'overview')}</strong><span class="sub">${s.site}</span></td><td>${statusBadge(s)}</td><td>${s.families.map(v=>`<span class="badge">v${v}</span>`).join(' ')}</td><td>${picker?(!supported?`DHCPv${state.family} not enabled`:!s.up?'Connection unavailable':'Ready to browse'):(!supported?'<span class="muted">Not enabled</span>':!s.up?'<span class="muted">Unknown</span>':serverLink(s,'subnets',String(subnetData.filter(d=>d.server===s.id&&d.v===state.family).length)))}</td><td class="muted">${picker?'':s.sync}</td><td><div class="row-actions">${picker?(supported?`<a class="btn small ${s.up?'primary':''}" href="${esc(url({scope:s.id}))}" data-server="${s.id}" data-section="${state.resource}">${state.resource==='leases'?'Open leases':'Open configuration'} ${icon('arrow')}</a>`:`<span class="small muted">DHCPv${state.family} unavailable</span>`):`${serverLink(s,'leases','Leases')}<span class="muted">·</span>${serverLink(s,inventory?'configuration':'overview',inventory?'Settings':'Open server →')}</div>`}</td></tr>`}).join('')}</tbody></table></div>`;}
function overview(){const s=single(),subs=scopedData(subnetData),res=scopedData(leaseData).filter(l=>l.reserved),online=selected().filter(s=>s.up&&s.families.includes(state.family));if(s&&!s.up)return sectionHead('Server overview',`Connection and service state for ${s.name}.`)+unavailable();if(s&&!s.families.includes(state.family))return unavailable();return sectionHead(s?'Server overview':'Overview',s?`Live DHCPv${state.family} data from ${s.name}.`:`DHCPv${state.family} services across ${selected().length} selected servers.`,s?link(`${icon('settings')} Server settings`,{resource:'configuration',sub:'connection'},'btn small'):'')+partialNotice()+`<div class="cards"><div class="stat"><div class="label">${s?'Service status':'Responding servers'}</div><div class="number">${s?'<span style="font-size:23px;color:var(--green)">Online</span>':online.length+' <span class="muted" style="font-size:15px">/ '+selected().filter(s=>s.families.includes(state.family)).length+'</span>'}</div><div class="foot">DHCPv${state.family} · current scope</div></div><div class="stat"><div class="label">Subnets</div><div class="number">${subs.length}</div>${link('Browse subnets →',{resource:'subnets',sub:''})}</div><div class="stat"><div class="label">Reservations</div><div class="number">${res.length}</div>${link('Browse reservations →',{resource:'reservations'})}</div><div class="stat"><div class="label">Leases</div><div class="number" style="font-size:${s?'28':'19'}px;padding:${s?'0':'7px 0'}">${s?scopedData(leaseData).length:'Per server'}</div>${link(s?'Browse leases →':'Choose a server →',{resource:'leases'})}</div></div>`+(s?`<div class="split"><section class="panel"><div class="panel-heading"><h3>DHCPv${state.family} service</h3><div class="spacer"></div><span class="badge good">Enabled</span></div><div class="panel-body"><dl class="definition"><dt>Server</dt><dd>${s.name}</dd><dt>Connection</dt><dd>Direct daemon</dd><dt>Version</dt><dd>Kea 3.2.0</dd><dt>IPAM sync</dt><dd><span class="badge good">Completed</span> <span class="muted">${s.sync}</span></dd><dt>Configuration</dt><dd>Persist changes to disk</dd></dl></div></section><section class="panel"><div class="panel-heading"><h3>Continue working</h3></div><div class="panel-body"><p class="small muted" style="margin-bottom:14px">All links keep ${s.name} and DHCPv${state.family} selected.</p><div style="display:grid;gap:12px">${link('Browse leases →',{resource:'leases'})}${link('Manage subnets and shared networks →',{resource:'subnets'})}${link('Manage reservations →',{resource:'reservations'})}${link('View synchronization →',{resource:'sync'})}</div></div></section></div>`:`<section class="panel"><div class="panel-heading"><h3>Servers in this scope</h3><div class="spacer"></div><span class="small muted">Open a server to work with it</span></div>${serverTable()}<div class="table-footer">Subnets reported by different servers remain separate records, even when their prefix and ID match.</div></section>`);}
function picker(){const leases=state.resource==='leases';return sectionHead(leases?'Leases':'Configuration',leases?'Lease operations belong to an individual server.':'Choose the server whose configuration you want to manage.')+`<section class="panel"><div class="chooser-intro"><div class="row" style="gap:12px"><span style="color:var(--teal)">${icon('server')}</span><div><h2>${leases?'Choose a server to browse leases':'Choose a server to configure'}</h2><p>${leases?'Open the full lease view for one server. Your current selection and DHCP protocol carry through.':'DHCP options and connection settings apply to one named server.'}</p></div></div></div>${serverTable(true)}<div class="table-footer">${icon('info')}Selecting a row opens that server’s workspace. The scope bar shows the new location.</div></section>`;}
function toolbar(placeholder){return `<form id="filter-form" class="toolbar"><label class="sr-only" for="table-search">Search ${state.resource}</label><input class="search" id="table-search" name="q" value="${esc(state.q)}" placeholder="${placeholder}">${state.resource==='leases'?`<label class="sr-only" for="lease-state">Lease state</label><select class="search" id="lease-state" name="status"><option value="">Any state</option><option ${state.status==='Active'?'selected':''}>Active</option><option ${state.status==='Declined'?'selected':''}>Declined</option></select>`:''}<button class="btn" type="submit">${icon('search')} Filter</button>${state.q||state.status?link('Clear',{q:'',status:''},'btn ghost'):''}<div class="spacer"></div><button type="button" class="btn small purple" data-action="export">${icon('download')} Export shown rows</button></form>`;}
function emptyRow(cols){return `<tr><td colspan="${cols}" class="empty"><h3>No matching records</h3><p style="margin:6px auto 12px">Try a different search in this scope.</p>${link('Clear filters',{q:'',status:''},'btn small')}</td></tr>`;}
function tablePanel(headers,body,count){return `<section class="panel"><div class="table-wrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${body||emptyRow(headers.length)}</tbody></table></div><div class="table-footer"><span>${count} record${count===1?'':'s'} · ${esc(scopeShort())} · DHCPv${state.family}</span><div class="spacer"></div><span>Sample data</span></div></section>`;}
function matched(data){const q=state.q.toLowerCase();return data.filter(d=>Object.values(d).join(' ').toLowerCase().includes(q)||(d.subnet&&subnetData.some(n=>n.server===d.server&&n.v===d.v&&n.id===d.subnet&&n.cidr.toLowerCase()===q)));}
function subnets(){const shared=state.sub==='networks',s=single(),fail=unavailable();return `<div class="subtabs">${link('Subnets',{sub:'',detail:'',q:''},!shared?'active':'')}${link('Shared networks',{sub:'networks',detail:'',q:''},shared?'active':'')}</div>`+sectionHead(shared?'Shared networks':'Subnets',s?`DHCPv${state.family} configuration on ${s.name}.`:'Browse across servers. Open a row on its server to see details or make changes.',s&&!fail?`<button class="btn primary small" data-action="add">${icon('plus')} Add ${shared?'shared network':'subnet'}</button>`:'')+(fail||partialNotice()+toolbar(shared?'Search by network name…':'Search by prefix, ID or network…')+subnetsTable(shared));}
function subnetsTable(shared){const rows=matched(scopedData(subnetData));return tablePanel(shared?['Shared network','Server','Subnet','Subnet ID','']:['Prefix','Server','Subnet ID','Shared network','Pool utilization',''],rows.map(d=>{const s=servers.find(x=>x.id===d.server);const detail=shared?`network-${d.id}`:`subnet-${d.id}`;return `<tr><td><strong>${serverLink(s,'subnets',shared?d.network:`<span class="mono">${d.cidr}</span>`,detail)}</strong>${!shared?`<span class="sub">${d.description}</span>`:''}</td><td>${owner(d.server)}</td><td>${shared?`<span class="mono">${d.cidr}</span>`:d.id}</td><td>${shared?d.id:serverLink(s,'subnets',d.network,`network-${d.id}`)}</td>${!shared?`<td><div class="utilization"><span class="track"><span style="width:${Math.round(d.used/d.total*100)}%"></span></span><span>${Math.round(d.used/d.total*100)}%</span></div><span class="sub">${d.used} / ${d.total} addresses</span></td>`:''}<td class="right">${serverLink(s,'subnets',single()?'View →':'Open on server →',detail)}</td></tr>`}).join(''),rows.length);}
function reservations(){const fail=unavailable(),s=single(),rows=matched(scopedData(leaseData).filter(l=>l.reserved));return sectionHead('Reservations',s?`DHCPv${state.family} host reservations on ${s.name}.`:'All matching reservations, with their owning server always visible.',s&&!fail?`<button class="btn primary small" data-action="add">${icon('plus')} Add reservation</button>`:'')+(fail||partialNotice()+toolbar('Search by address, hostname or identifier…')+tablePanel(['Address','Hostname','Server','Identifier','Subnet ID','NetBox',''],rows.map(d=>`<tr><td class="mono">${d.ip}</td><td>${d.name}</td><td>${owner(d.server)}</td><td class="mono">${d.mac}</td><td>${d.subnet}</td><td><span class="badge teal">${d.ipam}</span></td><td class="right">${serverLink(servers.find(s=>s.id===d.server),'reservations',single()?'View →':'Open on server →',`reservation-${d.ip}`)}</td></tr>`).join(''),rows.length));}
function leases(){if(!single())return picker();const fail=unavailable(),s=single(),rows=matched(scopedData(leaseData)).filter(d=>!state.status||d.state===state.status);return sectionHead('Leases',`Browse and manage DHCPv${state.family} leases on ${s.name}.`,!fail?`<button class="btn primary small" data-action="add">${icon('plus')} Add lease</button>`:'')+(fail||toolbar('Search by address, hostname or MAC…')+tablePanel(['Address','Hostname','State','Subnet ID','Valid for','Reservation / NetBox',''],rows.map(d=>`<tr><td><strong>${serverLink(s,'leases',`<span class="mono">${d.ip}</span>`,`lease-${d.ip}`)}</strong><span class="sub mono">${d.mac}</span></td><td>${d.name}</td><td><span class="badge ${d.state==='Active'?'good':'warn'}">${d.state}</span></td><td>${d.subnet}</td><td>${d.expires}</td><td>${d.reserved?'<span class="badge teal">Reserved</span>':'<span class="small muted">Dynamic</span>'}<span class="sub">${d.ipam}</span></td><td class="right">${serverLink(s,'leases','View →',`lease-${d.ip}`)}</td></tr>`).join(''),rows.length));}
function configuration(){if(!single())return picker();const s=single(),connection=state.sub==='connection',history=state.sub==='history';let html=`<div class="subtabs">${link('DHCP options',{sub:''},!connection&&!history?'active':'')}${link('Server settings',{sub:'connection'},connection?'active':'')}${link('History',{sub:'history'},history?'active':'')}</div>`+sectionHead(connection?'Server settings':history?'Server history':'DHCP options',connection?`NetBox server object: ${s.name}. Connection settings apply to this server.`:history?`Changes recorded for ${s.name}.`:`DHCPv${state.family} options on ${s.name}.`);if(connection)return html+`<div class="panel"><div class="panel-heading"><h3>Connection</h3><div class="spacer"></div><button class="btn small" data-action="edit-settings">${icon('edit')} Edit settings</button></div><div class="panel-body"><dl class="definition"><dt>Name</dt><dd>${s.name}</dd><dt>Protocols</dt><dd>${s.families.map(v=>'DHCPv'+v).join(', ')}</dd><dt>Control endpoint</dt><dd class="mono">https://${s.name}.example/</dd><dt>Connection mode</dt><dd>Direct daemon</dd><dt>TLS verification</dt><dd>Enabled</dd><dt>Persist configuration</dt><dd>Enabled</dd><dt>Tags</dt><dd><span class="badge teal">example</span></dd></dl></div></div>`;if(history)return html+tablePanel(['Time','Event','Actor'],`<tr><td>Today, 09:42 UTC</td><td>IPAM sync completed</td><td>System job</td></tr><tr><td>Today, 08:10 UTC</td><td>Server settings updated</td><td>Demo user</td></tr>`,2);return html+(unavailable()||tablePanel(['Code','Name','Value',''],`<tr><td>${state.family===4?'6':'23'}</td><td>${state.family===4?'domain-name-servers':'dns-servers'}</td><td class="mono">${state.family===4?'198.18.0.53':'2001:db8::53'}</td><td class="right"><button class="btn small" data-action="edit-option">Edit</button></td></tr><tr><td>${state.family===4?'15':'24'}</td><td>${state.family===4?'domain-name':'domain-search'}</td><td class="mono">example</td><td class="right"><button class="btn small" data-action="edit-option">Edit</button></td></tr>`,2));}
function syncView(){const s=single();return sectionHead(s?'Server synchronization':'Synchronization',s?`IPAM synchronization for ${s.name}.`:'Job results across the selected servers. Open a server for its sync settings.')+tablePanel(['Server','Last run','Result','Scope',''],selected().map(s=>`<tr><td>${owner(s.id,'sync')}</td><td>${s.sync}</td><td><span class="badge ${s.up?'good':'bad'}">${s.up?'Completed':'Unavailable'}</span></td><td>All enabled protocols</td><td class="right">${single()?'<button class="btn small" data-action="sync-demo">Sync now</button>':serverLink(s,'sync','Open sync →')}</td></tr>`).join(''),selected().length);}
function details(){const s=single();if(!s)return overview();const isSubnet=state.detail.startsWith('subnet-'),isNetwork=state.detail.startsWith('network-'),isLease=state.detail.startsWith('lease-');const d=isSubnet||isNetwork?subnetData.find(d=>d.server===s.id&&d.v===state.family&&d.id===Number(state.detail.split('-')[1])):leaseData.find(d=>d.server===s.id&&d.v===state.family&&d.ip===state.detail.slice(state.detail.indexOf('-')+1));if(!d)return `<div class="panel empty"><h2>Record unavailable in this scope</h2>${link('Back to list',{detail:''},'btn')}</div>`;const title=isSubnet?d.cidr:isNetwork?d.network:d.ip;return `<div class="return-link">${link(`${icon('back')} Back to ${isNetwork?'shared networks':state.resource}`,{detail:''})}</div>`+sectionHead(title,`${isSubnet?'Subnet':isNetwork?'Shared network':isLease?'Lease':'Reservation'} · ${s.name} · DHCPv${state.family}`,`<button class="btn small" data-action="edit-record">${icon('edit')} Edit ${isSubnet?'subnet':isNetwork?'network':isLease?'lease':'reservation'}</button>`)+`<div class="split"><div class="panel"><div class="panel-heading"><h3>${isSubnet?'Subnet details':isNetwork?'Shared network details':'Record details'}</h3></div><div class="panel-body"><dl class="definition"><dt>Owning server</dt><dd>${serverLink(s,'overview')}</dd><dt>Protocol</dt><dd>DHCPv${state.family}</dd>${isSubnet||isNetwork?`<dt>Subnet ID</dt><dd>${d.id}</dd><dt>Prefix</dt><dd class="mono">${d.cidr}</dd><dt>Shared network</dt><dd>${d.network}</dd><dt>Address pool</dt><dd class="mono">${d.pools}</dd>`:`<dt>IP address</dt><dd class="mono">${d.ip}</dd><dt>Hostname</dt><dd>${d.name}</dd><dt>Identifier</dt><dd class="mono">${d.mac}</dd><dt>Subnet ID</dt><dd>${d.subnet}</dd><dt>State</dt><dd>${d.state}</dd>`}</dl></div></div><div class="panel"><div class="panel-heading"><h3>Related data on this server</h3></div><div class="panel-body"><p class="small muted" style="margin-bottom:15px">${s.name} · DHCPv${state.family}</p><div style="display:grid;gap:12px">${link('Browse leases →',{resource:'leases',detail:'',q:isSubnet?d.cidr:''})}${link('Browse reservations →',{resource:'reservations',detail:'',q:''})}${link('View all subnets →',{resource:'subnets',detail:'',sub:'',q:''})}</div></div></div></div>`;}
function directory(){return `<div class="directory-intro"><h2>Which server are you working on?</h2><p>Choose a server for day-to-day operations. Use the catalogues below to browse across servers.</p></div><section class="panel"><div class="panel-heading"><h3>Server workspaces</h3><span class="spacer"></span><span class="small muted">${selected().length} servers</span></div>${serverTable()}</section><div class="launch-grid"><div class="launch-card">${icon('network')}<h3>Subnet catalogue</h3><p>Find subnets and shared networks across your servers.</p>${link('Browse subnets',{resource:'subnets'},'btn')}</div><div class="launch-card">${icon('bookmark')}<h3>Reservation catalogue</h3><p>Locate a reservation, then open it on its owning server.</p>${link('Browse reservations',{resource:'reservations'},'btn')}</div><div class="launch-card">${icon('refresh')}<h3>Synchronization</h3><p>Check recent IPAM sync results across your servers.</p>${link('View sync results',{resource:'sync'},'btn')}</div></div>`;}
function rail(){return `<aside class="server-rail" aria-label="Server scopes"><div class="rail-title">Server scope</div>${link(`${icon('layers')} &nbsp; All servers`,{scope:'all',detail:'',q:''},state.scope==='all'?'active':'')}<div class="divider"></div>${servers.map(s=>`<a class="${single()?.id===s.id?'active':''}" href="${esc(url({scope:s.id,detail:'',q:''}))}" data-server="${s.id}" data-section="${state.resource}"><span class="dot ${s.up?'':'down'}"></span>${s.name}<small>${s.families.map(v=>'DHCPv'+v).join(' · ')}</small></a>`).join('')}<div class="divider"></div><button class="btn ghost small" data-action="scope">${icon('settings')} Choose several</button></aside>`;}
function content(){if(state.detail)return details();return ({overview,leases,subnets,reservations,configuration,sync:syncView}[state.resource]||overview)();}
function render(){document.title=`${single()?single().name:scopeShort()} · ${resources.find(r=>r[0]===state.resource)?.[1]||'Servers'} · Kea prototype`;const s=single(),admin=['inventory','jobs'].includes(state.resource),isDirectory=state.variant==='C'&&!s&&state.resource==='overview';const crumb=`<nav class="breadcrumbs" aria-label="Breadcrumb">${link('DHCP Kea',{resource:'overview',detail:'',q:'',sub:''})}<span class="divider">/</span>${s?link('All servers',{scope:'all',resource:state.variant==='C'?'overview':state.resource,detail:'',q:''})+'<span class="divider">/</span>':''}<span>${esc(admin?(state.resource==='inventory'?'Server inventory':'Sync jobs'):scopeShort())}</span>${!admin?`<span class="divider">/</span><span>DHCPv${state.family}</span><span class="divider">/</span><span>${resources.find(r=>r[0]===state.resource)?.[1]}</span>`:''}</nav>`;const title=admin?(state.resource==='inventory'?'Server inventory':'Sync jobs'):state.variant==='C'?(s?s.name:'Kea DHCP'):s?s.name:'Kea DHCP';const heading=`<div class="page-heading"><div><h1>${title}</h1><p>${admin?'Manage the NetBox server records and their background jobs.':s?'Server workspace · '+s.site:state.variant==='C'?'Server workspaces and cross-server catalogues':'One workspace for your DHCP infrastructure'}</p></div><div class="spacer"></div>${!admin?'<button class="btn small" data-action="notes">'+icon('info')+' About this proposal</button>':''}</div>`;const back=s?`<div class="return-link"><a href="${esc(url(returnScope||{scope:'all',detail:'',q:''}))}" data-action="return">${icon('back')} ${returnScope?'Back to '+(returnScope.scope==='all'?'all servers':'selected servers'):'All servers'}${returnScope?' · '+(resources.find(r=>r[0]===returnScope.resource)?.[1]||'Overview'):''}</a></div>`:'';let body;if(admin){body=state.resource==='inventory'?sectionHead('Configured servers','Server names open their workspaces. Settings open the NetBox server object.')+`<section class="panel">${serverTable(false,true)}</section>`:syncView();}else{body=back+scopeBar()+(!isDirectory?tabs():'')+`<div class="content">${isDirectory?directory():content()}</div>`;}document.getElementById('app').innerHTML=`<div class="variant-${state.variant.toLowerCase()}">${crumb}${heading}${state.variant==='B'&&!admin?`<div class="rail-layout">${rail()}<div class="workspace">${body}</div></div>`:body}</div>`;document.getElementById('variant-buttons').innerHTML=Object.entries(variants).map(([k,n])=>`<button class="${state.variant===k?'active':''}" data-variant="${k}" aria-pressed="${state.variant===k}">${k} · ${n}${k==='A'?' ★':''}</button>`).join('');renderSidebar();document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));}
function renderSidebar(){const names=['Organization','Racks','Devices','Connections','Wireless','IPAM','VPN','Virtualization','Circuits','Power','Cooling','Provisioning','Customization','Operations'];document.getElementById('side-items').innerHTML=names.map((name,i)=>`<div class="side-row">${icon(['grid','server','server','network','network','layers'][i%6])}<span>${name}</span><span class="chev">⌄</span></div>`).join('')+`<div class="side-row active">${icon('network')} DHCP Kea <span class="chev">⌄</span></div><div class="side-group"><div class="caption">Management</div>${link('Workspace',{resource:'overview',sub:'',detail:'',q:''},'side-link '+(!['inventory','jobs'].includes(state.resource)?'selected':''))}${link('Servers',{resource:'inventory',scope:'all',detail:'',q:''},'side-link '+(state.resource==='inventory'?'selected':''))}${link('Sync Jobs',{resource:'jobs',scope:'all',detail:'',q:''},'side-link '+(state.resource==='jobs'?'selected':''))}</div><div class="side-row">${icon('lock')} Admin <span class="chev">⌄</span></div>`;}
function toast(message){clearTimeout(toastTimer);document.getElementById('toast').textContent=message;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4500);}
function modal(title,body,footer=''){const d=document.getElementById('dialog');d.innerHTML=`<div class="dialog-heading"><h2>${title}</h2><div class="spacer"></div><button class="btn ghost icon-only" data-action="close" aria-label="Close dialog">${icon('close')}</button></div><div class="dialog-content">${body}</div><div class="dialog-footer">${footer||'<button class="btn" data-action="close">Close</button>'}</div>`;d.showModal();}
function notes(){modal('Proposal: make server scope explicit',`<p><strong>Recommended starting point: A · Scope bar.</strong> Keep familiar NetBox tabs and put server scope and protocol in one persistent place.</p><ol><li><strong>One workspace.</strong> Replace the separate Combined View with an all-server scope. Overview, Subnets, Reservations and Sync keep their place when the scope changes.</li><li><strong>One server means its own view.</strong> Selecting only one server opens that server’s workspace. No second, filtered combined version.</li><li><strong>Leases belong to a server.</strong> In an all-server or multi-server scope, Leases shows a server chooser. Opening a server gives you its full lease view.</li><li><strong>Combined data is for discovery.</strong> Each row keeps its server identity. Opening a row changes scope visibly. An explicit return link restores the previous catalogue and filters.</li><li><strong>One protocol switch.</strong> DHCPv4 / DHCPv6 stays in the scope bar. Unsupported protocols and unreachable servers have explicit states.</li></ol><p><strong>Compare the alternatives:</strong><br>B keeps every server visible in a left rail, useful with a short server list.<br>C starts with a server directory and offers cross-server catalogues as secondary tools.</p><p class="muted small">Try: Subnets → Open on server → Back to all servers. Then Leases → Choose a server. Also try selecting two servers, DHCPv6 on demo-edge, and demo-lab. All data is fictional. Form previews do not contact a server. Left/right arrow keys switch layout proposals.</p>`);}
function editPreview(kind){const s=single();if(!s)return;const adding=kind==='add',lease=state.resource==='leases',reservation=state.resource==='reservations',connection=kind==='edit-settings';const object=connection?'server settings':state.resource==='configuration'?'DHCP option':state.resource==='subnets'?(state.sub==='networks'?'shared network':'subnet'):reservation?'reservation':'lease';const label=connection?'Server name':lease||reservation?'IP address':state.resource==='subnets'?(state.sub==='networks'?'Network name':'Prefix'):'Value';modal(`${adding?'Add':'Edit'} ${object}`,`<div class="target-strip">${icon('server')} <strong>${s.name}</strong> <span class="muted">/ ${connection?'NetBox server settings':'DHCPv'+state.family}</span></div><p class="muted">Form preview. The destination stays visible while you work.</p><label class="field">${label}<input class="search" id="preview-value" value="${connection?s.name:adding?'':lease||reservation?(state.family===4?'198.18.10.55':'2001:db8:10::105'):state.resource==='subnets'?'198.18.10.0/24':'198.18.0.53'}" placeholder="${lease||reservation?'198.18.10.90':'Example value'}"></label><label class="field">${lease||reservation?'Hostname':'Description'}<input class="search" placeholder="${lease||reservation?'client.example':'Optional description'}"></label><p class="small muted">Navigation prototype only. Save behavior is outside this proposal.</p>`,`<button class="btn" data-action="close">Cancel</button><button class="btn primary" data-action="preview-save">Finish preview</button>`);}
function exportRows(){let rows=state.resource==='subnets'?matched(scopedData(subnetData)):matched(scopedData(leaseData)).filter(d=>state.resource!=='reservations'||d.reserved).filter(d=>state.resource!=='leases'||!state.status||d.state===state.status);const headers=Object.keys(rows[0]||{server:''});const cell=s=>'"'+String(s).replaceAll('"','""')+'"';const csv=[headers,...rows.map(r=>headers.map(h=>r[h]))].map(r=>r.map(cell).join(',')).join('\r\n');const objectURL=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));const a=document.createElement('a');a.href=objectURL;a.download=`kea-prototype-${state.resource}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(objectURL),1000);toast('Exported the fictional rows currently shown.');}
document.addEventListener('click',e=>{const v=e.target.closest('[data-variant]');if(v){nav({variant:v.dataset.variant});return;}const server=e.target.closest('[data-server]');if(server){if(e.metaKey||e.ctrlKey)return;e.preventDefault();openServer(server.dataset.server,server.dataset.section,server.dataset.detail||'');return;}const action=e.target.closest('[data-action]');if(action){e.preventDefault();const a=action.dataset.action;if(a==='scope'){const menu=document.getElementById('scope-menu');menu.hidden=!menu.hidden;document.querySelector('.scope-trigger').setAttribute('aria-expanded',String(!menu.hidden));if(!menu.hidden)document.getElementById('server-search').focus();}else if(a==='apply-scope'){const ids=[...document.querySelectorAll('[name="scope-choice"]:checked')].map(x=>x.value);if(!ids.length){toast('Select at least one server.');return;}if(ids.length===1&&!single())returnScope={...state};nav({scope:ids.length===4?'all':ids.join(','),detail:''});}else if(a==='return'){const previous=returnScope;returnScope=null;nav(previous?{...previous,variant:state.variant}:{scope:'all',detail:'',q:''});}else if(a==='notes')notes();else if(a==='theme')document.body.classList.toggle('theme-dark');else if(a==='previous'||a==='next'){const all=Object.keys(variants);nav({variant:all[(all.indexOf(state.variant)+(a==='next'?1:2))%3]});}else if(a==='close')document.getElementById('dialog').close();else if(['add','edit-record','edit-settings','edit-option'].includes(a))editPreview(a);else if(a==='preview-save'){document.getElementById('dialog').close();toast(`Preview complete. Target: ${single().name} · DHCPv${state.family}. No data changed.`);}else if(a==='retry')toast('Demo state: demo-lab is still unreachable.');else if(a==='export')exportRows();else if(a==='sync-demo')toast(`Sync preview for ${single().name}. No job was submitted.`);return;}const anchor=e.target.closest('a[data-nav]');if(anchor){if(e.ctrlKey||e.metaKey)return;e.preventDefault();history.pushState({},'',anchor.href);readState();render();return;}const menu=document.getElementById('scope-menu');if(menu&&!menu.hidden&&!e.target.closest('.scope-wrap')){menu.hidden=true;document.querySelector('.scope-trigger').setAttribute('aria-expanded','false');}});
document.addEventListener('change',e=>{if(e.target.id==='scope-all')document.querySelectorAll('[name="scope-choice"]').forEach(x=>x.checked=e.target.checked);if(e.target.id==='scope-all'||e.target.name==='scope-choice'){const n=document.querySelectorAll('[name="scope-choice"]:checked').length;document.getElementById('scope-all').checked=n===4;document.getElementById('selection-count').textContent=n+' selected';document.querySelector('[data-action="apply-scope"]').disabled=n===0;}});
document.addEventListener('input',e=>{if(e.target.id==='server-search')document.querySelectorAll('[data-scope-option]').forEach(x=>x.hidden=!x.dataset.scopeOption.includes(e.target.value.toLowerCase()));});
document.addEventListener('submit',e=>{if(e.target.id==='filter-form'){e.preventDefault();const data=new FormData(e.target);nav({q:data.get('q')||'',status:data.get('status')||''});}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.getElementById('scope-menu');if(m){m.hidden=true;document.querySelector('.scope-trigger').setAttribute('aria-expanded','false');}}if(['ArrowLeft','ArrowRight'].includes(e.key)&&!e.target.closest('input,textarea,select,[contenteditable="true"]')&&!document.getElementById('dialog').open){e.preventDefault();const a=Object.keys(variants);nav({variant:a[(a.indexOf(state.variant)+(e.key==='ArrowRight'?1:2))%3]});}});
addEventListener('popstate',()=>{readState();render();});
readState();render();
</script>
</body>
</html>
