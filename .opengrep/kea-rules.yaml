#
# Custom opengrep ruleset encoding the project's AGENTS.md security/correctness
# invariants. The local pre-commit hook runs these rules through
# scripts/opengrep-scan.sh.
#
# Rule-test fixtures live in .opengrep/tests/; run them with scripts/opengrep-test.sh.
rules:
  - id: kea-config-phase-without-reply-validation
    languages: [python]
    severity: ERROR
    message: >-
      Send config-test, config-set, and config-write through _config_phase_command()
      so each phase requires one well-formed reply before accepting a result code.
    paths:
      exclude:
        - "**/tests/**"
    pattern-either:
      - pattern: $CLIENT.command("=~/^config-(test|set|write)$/", ...)
      - pattern: $CLIENT.command(..., command="=~/^config-(test|set|write)$/", ...)
      - pattern: $CLIENT._config_mutation_command("config-set", ...)
      - pattern: $CLIENT._config_mutation_command(..., command="config-set", ...)

  - id: kea-sync-hostname-unvalidated
    languages: [python]
    severity: ERROR
    message: >-
      Read raw sync hostnames through _record_hostname() so malformed values
      cannot enter the complete keep-set or become cleanup keys.
    metadata:
      category: correctness
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern-inside: |
              def sync_lease_to_netbox(...):
                  ...
          - pattern-inside: |
              def _record_hostname_and_addresses(...):
                  ...
      - pattern-either:
          - pattern: $RECORD.get("hostname", ...)
          - pattern: $RECORD["hostname"]

  - id: kea-get-client-missing-version
    languages: [python]
    severity: WARNING
    message: >-
      Pass an explicit DHCP version to server.get_client(version=...) when the
      version is known. On dual-URL servers, omitting version= can hit the wrong
      daemon endpoint. If the call is deliberately version-agnostic (e.g. the
      Control Agent status check), suppress it on that line with
      `# nosemgrep: kea-get-client-missing-version`.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Always pass version= to server.get_client()"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern: $X.get_client()

  - id: kea-exception-detail-in-response
    languages: [python]
    severity: ERROR
    message: >-
      Do not leak exception details to user-facing responses. str(exc) or an
      f-string interpolating a caught exception can expose internal URLs, TLS
      details, or Kea API config. Log server-side with logger.exception() and
      return a generic message (or a sanitised kea_error_hint()).
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      references:
        - "CLAUDE.md: Never leak exception details to HTTP responses"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          try:
              ...
          except $EXC as $E:
              ...
      - pattern-either:
          - pattern: messages.error($REQ, str($E), ...)
          - pattern: messages.warning($REQ, str($E), ...)
          - pattern: messages.info($REQ, str($E), ...)
          - pattern: messages.error($REQ, f"...{$E}...", ...)
          - pattern: messages.warning($REQ, f"...{$E}...", ...)
          - pattern: messages.info($REQ, f"...{$E}...", ...)
          - pattern: HttpResponse(str($E), ...)
          - pattern: HttpResponse(f"...{$E}...", ...)
          - pattern: HttpResponseBadRequest(str($E), ...)
          - pattern: HttpResponseBadRequest(f"...{$E}...", ...)
          - pattern: HttpResponseServerError(str($E), ...)
          - pattern: HttpResponseServerError(f"...{$E}...", ...)
          - pattern: JsonResponse(str($E), ...)
          - pattern: Response(str($E), ...)
          - pattern: Response(f"...{$E}...", ...)

  - id: kea-command-result-indexed-without-guard
    languages: [python]
    severity: ERROR
    message: >-
      Do not index a Kea command result directly (client.command(...)[0]).
      command() only guarantees a list; an empty or malformed payload makes
      [0] raise IndexError/TypeError. Assign the result and validate its shape
      (non-empty list with a dict first entry) before indexing — see
      _require_first_entry() in views/combined.py.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Validate Kea response shape before indexing resp[0]"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern: $C.command(...)[0]

  - id: kea-reservation-command-outside-adapter
    languages: [python]
    severity: ERROR
    message: >-
      Only netbox_kea/kea.py may send a reservation-* command. Its results are raw
      Kea Reservation records, whose keys only netbox_kea/reservations.py knows how
      to read. Every other module consumes the typed Reservation, ReservationIdentity
      and ReservationScope values those two build, so raw Reservation keys cannot
      spread back out of the private adapters.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CONTEXT.md: Reservation, Reservation Identity, Reservation Scope"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
        - "netbox_kea/kea.py"
    patterns:
      - pattern-either:
          - pattern: $C.command("=~/^reservation-/", ...)
          - pattern: $C.command(command="=~/^reservation-/", ...)

  - id: kea-config-read-modify-write-without-reader
    languages: [python]
    severity: ERROR
    message: >-
      Read the live configuration for a read-modify-write through
      KeaClient._config_for_update(). It validates the config-get reply and the
      Dhcp4/Dhcp6 block before the mutation reads it, and _config_entries()
      validates each list the mutation walks. A hand-parsed config-get reply
      turns a malformed block into an AttributeError and an HTTP 500.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Validate Kea response shape before indexing"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
            $S._apply_config(...)
      - pattern-either:
          - pattern: $C.command("config-get", ...)
          - pattern: $C.command(command="config-get", ...)

  - id: kea-unsupported-command-inline-check
    languages: [python]
    severity: ERROR
    message: >-
      Use KeaException.unsupported_command instead of comparing the response result with 2.
      The property is the one definition of an unsupported command.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: $EXC.response.get("result") == 2
          - pattern: $EXC.response.get("result") != 2
          - pattern: $EXC.response["result"] == 2
          - pattern: $EXC.response["result"] != 2
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      $R = $EXC.response.get("result")
                      ...
                  - pattern-inside: |
                      $R = $EXC.response["result"]
                      ...
              # A later assignment replaces the Kea result.
              - pattern-not-inside: |
                  $R = $FIRST
                  ...
                  $R = $OTHER
                  ...
              - pattern-either:
                  - pattern: $R == 2
                  - pattern: $R != 2
      - pattern-not-inside: |
          class KeaException(...):
              ...

  - id: netbox-ipam-get-or-create-non-unique-key
    languages: [python]
    severity: ERROR
    message: >-
      NetBox does not enforce Prefix, IPRange, or IPAddress keys in the database.
      ENFORCE_GLOBAL_UNIQUE is checked only in clean(), so duplicate rows can exist.
      get_or_create() then raises MultipleObjectsReturned on every run.
      Query with filter(...) and handle more than one match explicitly, as sync._single_match does.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern: $QS.get_or_create(...)
      # An exact primary-key lookup matches at most one row.
      - pattern-not: $QS.get_or_create(..., pk=$PK, ...)
      - pattern-not: $QS.get_or_create(..., id=$PK, ...)
      # The receiver can be a queryset chain, e.g. Prefix.objects.filter(...).
      - metavariable-pattern:
          metavariable: $QS
          pattern-either:
            - pattern: <... Prefix.objects ...>
            - pattern: <... IPRange.objects ...>
            - pattern: <... IPAddress.objects ...>
