#
# Custom opengrep ruleset encoding the project's AGENTS.md security/correctness
# invariants. The local pre-commit hook runs these rules through
# scripts/opengrep-scan.sh.
#
# Rule-test fixtures live in .opengrep/tests/; run them with scripts/opengrep-test.sh.
rules:
  - id: kea-queryset-model-attribute-discriminator
    languages: [python]
    severity: ERROR
    message: >-
      Use isinstance with QuerySet to distinguish a queryset from a model instance.
      A model instance can also have a model attribute.
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      - pattern: hasattr($OBJECT, "model")
      - pattern: getattr($OBJECT, "model", type($OBJECT))

  - id: kea-config-phase-without-reply-validation
    languages: [python]
    severity: ERROR
    message: >-
      Send config-test and config-write through _one_command(), and config-set through
      _config_mutation_command(), so each phase requires one well-formed reply before
      accepting a result code.
    paths:
      exclude:
        - "**/tests/**"
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CLIENT.command(KeaCommand.$M, ...)
              - pattern: $CLIENT.command(..., command=KeaCommand.$M, ...)
          - metavariable-regex:
              metavariable: $M
              regex: ^CONFIG_(TEST|SET|WRITE)$
      - pattern: $CLIENT._one_command(KeaCommand.CONFIG_SET, ...)

  - id: kea-sync-hostname-unpublished
    languages: [python]
    severity: ERROR
    message: >-
      The IPAM and MAC sync must report the name that Kea publishes. Pass a lease
      hostname through lease_published_name() and a Reservation through
      reservation_published_name() in netbox_kea/published_name.py.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "https://github.com/marcinpsk/netbox-kea/issues/304"
    paths:
      include:
        - "netbox_kea/ipam_reconciliation.py"
        - "netbox_kea/integrations/dhcp_plugin.py"
        - "kea-sync-hostname-unpublished.py"
    patterns:
      # A reported name reaches the sync as a call argument or in a (hardware, hostname) pair.
      - pattern-either:
          - pattern: $FUNCTION(..., $RECORD.hostname, ...)
          - pattern: ($HARDWARE, $RECORD.hostname)
      - metavariable-regex:
          metavariable: $RECORD
          regex: (?i)(lease|reservation|record)$
      - pattern-not: lease_published_name(...)

  - id: kea-get-client-missing-version
    languages: [python]
    severity: WARNING
    message: >-
      Pass an explicit DHCP version to server.get_client(version=...) when the
      version is known. On dual-URL servers, omitting version= can hit the wrong
      daemon endpoint. If the call is deliberately version-agnostic (e.g. the
      Control Agent status check), suppress it on that line with
      `# nosemgrep: kea-get-client-missing-version`.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Always pass version= to server.get_client()"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern: $X.get_client()

  - id: kea-exception-detail-in-response
    languages: [python]
    severity: ERROR
    message: >-
      Do not leak exception details to user-facing responses. str(exc) or an
      f-string interpolating a caught exception can expose internal URLs, TLS
      details, or Kea API config. Log server-side with logger.exception() and
      return a generic message (or a sanitised kea_error_hint()).
    metadata:
      category: security
      confidence: HIGH
      cwe:
        - "CWE-209: Generation of Error Message Containing Sensitive Information"
      owasp:
        - "A09:2021 - Security Logging and Monitoring Failures"
      references:
        - "CLAUDE.md: Never leak exception details to HTTP responses"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          try:
              ...
          except $EXC as $E:
              ...
      - pattern-either:
          - pattern: messages.error($REQ, str($E), ...)
          - pattern: messages.warning($REQ, str($E), ...)
          - pattern: messages.info($REQ, str($E), ...)
          - pattern: messages.error($REQ, f"...{$E}...", ...)
          - pattern: messages.warning($REQ, f"...{$E}...", ...)
          - pattern: messages.info($REQ, f"...{$E}...", ...)
          - pattern: HttpResponse(str($E), ...)
          - pattern: HttpResponse(f"...{$E}...", ...)
          - pattern: HttpResponseBadRequest(str($E), ...)
          - pattern: HttpResponseBadRequest(f"...{$E}...", ...)
          - pattern: HttpResponseServerError(str($E), ...)
          - pattern: HttpResponseServerError(f"...{$E}...", ...)
          - pattern: JsonResponse(str($E), ...)
          - pattern: Response(str($E), ...)
          - pattern: Response(f"...{$E}...", ...)

  - id: kea-command-result-indexed-without-guard
    languages: [python]
    severity: ERROR
    message: >-
      Do not index a Kea command result directly (client.command(...)[0]).
      command() only guarantees a list; an empty or malformed payload makes
      [0] raise IndexError/TypeError. Assign the result and validate its shape
      (non-empty list with a dict first entry) before indexing — see
      _require_first_entry() in views/combined.py.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Validate Kea response shape before indexing resp[0]"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern: $C.command(...)[0]

  - id: kea-reservation-command-outside-adapter
    languages: [python]
    severity: ERROR
    message: >-
      Only netbox_kea/kea.py may send a reservation-* command. Its results are raw
      Kea Reservation records, whose keys only netbox_kea/reservations.py knows how
      to read. Every other module consumes the typed Reservation, ReservationIdentity
      and ReservationScope values those two build, so raw Reservation keys cannot
      spread back out of the private adapters.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CONTEXT.md: Reservation, Reservation Identity, Reservation Scope"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
        - "netbox_kea/kea.py"
    patterns:
      - pattern-either:
          - pattern: $C.command(KeaCommand.$M, ...)
          - pattern: $C.command(..., command=KeaCommand.$M, ...)
      - metavariable-regex:
          metavariable: $M
          regex: ^RESERVATION_

  - id: kea-config-read-modify-write-without-reader
    languages: [python]
    severity: ERROR
    message: >-
      Read the live configuration for a read-modify-write through
      KeaClient.config_candidate(). It validates the config-get reply and the
      Dhcp4/Dhcp6 block before the edit reads it, and CandidateConfiguration
      validates each list the edit walks. A hand-parsed config-get reply
      turns a malformed block into an AttributeError and an HTTP 500.
    metadata:
      category: correctness
      confidence: HIGH
      references:
        - "CLAUDE.md: Validate Kea response shape before indexing"
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
            $S.config_set(...)
      - pattern-either:
          - pattern: $C.command(KeaCommand.CONFIG_GET, ...)
          - pattern: $C.command(..., command=KeaCommand.CONFIG_GET, ...)

  - id: kea-unsupported-command-inline-check
    languages: [python]
    severity: ERROR
    message: >-
      Use KeaException.unsupported_command instead of comparing the response result with 2.
      The property is the one definition of an unsupported command.
    metadata:
      category: maintainability
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
    # v2 syntax: only a negated `inside` can carry the reassignment conditions.
    match:
      all:
        - any:
            - $EXC.response.get("result") == 2
            - $EXC.response.get("result") != 2
            - $EXC.response["result"] == 2
            - $EXC.response["result"] != 2
            - all:
                - any:
                    - inside: |
                        $R = $EXC.response.get("result")
                        ...
                    - inside: |
                        $R = $EXC.response["result"]
                        ...
                # Code after a later assignment of $R sees a replaced value.
                - not:
                    inside:
                      all:
                        - |
                          $R = $OTHER
                          ...
                        - not: |
                            $R = $EXC.response.get("result")
                            ...
                        - not: |
                            $R = $EXC.response["result"]
                            ...
                        - inside:
                            any:
                              - |
                                $R = $EXC.response.get("result")
                                ...
                              - |
                                $R = $EXC.response["result"]
                                ...
                - any:
                    - $R == 2
                    - $R != 2
        - not:
            inside: |
              class KeaException(...):
                  ...

  - id: netbox-ipam-get-or-create-non-unique-key
    languages: [python]
    severity: ERROR
    message: >-
      NetBox does not enforce Prefix, IPRange, or IPAddress keys in the database.
      ENFORCE_GLOBAL_UNIQUE is checked only in clean(), so duplicate rows can exist.
      get_or_create() and update_or_create() then raise MultipleObjectsReturned on every run.
      Query with filter(...) and handle more than one match explicitly through IPAM reconciliation.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: $QS.get_or_create(...)
          - pattern: $QS.update_or_create(...)
      # An exact primary-key lookup matches at most one row.
      - pattern-not: $QS.get_or_create(..., pk=$PK, ...)
      - pattern-not: $QS.get_or_create(..., id=$PK, ...)
      - pattern-not: $QS.update_or_create(..., pk=$PK, ...)
      - pattern-not: $QS.update_or_create(..., id=$PK, ...)
      # The receiver can be a queryset chain, e.g. Prefix.objects.filter(...).
      - metavariable-pattern:
          metavariable: $QS
          pattern-either:
            - pattern: <... Prefix.objects ...>
            - pattern: <... IPRange.objects ...>
            - pattern: <... IPAddress.objects ...>

  - id: kea-config-change-rejection-caught-outside-mapper
    languages: [python]
    severity: ERROR
    message: >-
      Do not catch ConfigChangeRejected in a view. Run the change through
      _run_config_change() in views/_base.py, which is the one place that turns an
      outcome or a rejection into a message (ADR 0005). A second handler gives the
      same rejection a different message.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0005-configuration-changes-return-a-typed-outcome.md: Presentation"
    paths:
      include:
        - "**/views/**"
    patterns:
      # `except (..., $EXC, ...):` also matches `except $EXC:`. With `as`, it matches only a tuple.
      - pattern-either:
          - pattern: |
              try:
                  ...
              except (..., $EXC, ...):
                  ...
          - pattern: |
              try:
                  ...
              except $EXC as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., $EXC, ...) as $E:
                  ...
      - metavariable-pattern:
          metavariable: $EXC
          pattern-either:
            - pattern: ConfigChangeRejected
            - pattern: $MODULE.ConfigChangeRejected
      - pattern-not-inside: |
          def _run_config_change(...):
              ...
      - focus-metavariable: $EXC

  - id: kea-config-change-mapper-outside-base
    languages: [python]
    severity: ERROR
    message: >-
      Define _run_config_change only in views/_base.py. The rule
      kea-config-change-rejection-caught-outside-mapper exempts a function by
      this name, so a second definition in another view would hide its catch of
      ConfigChangeRejected.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0005-configuration-changes-return-a-typed-outcome.md: Presentation"
    paths:
      include:
        - "**/views/**"
      exclude:
        - "**/views/_base.py"
    pattern: |
      def _run_config_change(...):
          ...

  - id: kea-config-change-in-broad-except
    languages: [python]
    severity: ERROR
    message: >-
      Do not call a config_write operation inside a try whose except catches
      Exception, BaseException, or everything. That handler also catches
      ConfigChangeRejected and hides it from _run_config_change() in
      views/_base.py. Pass the call to _run_config_change() as a lambda, and
      catch only the errors that you expect.
    metadata:
      category: maintainability
      confidence: HIGH
      references:
        - "docs/adr/0005-configuration-changes-return-a-typed-outcome.md: Presentation"
    paths:
      include:
        - "**/views/**"
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern-inside: |
                      try:
                          ...
                      except (..., $EXC, ...):
                          ...
                  - pattern-inside: |
                      try:
                          ...
                      except $EXC as $E:
                          ...
                  - pattern-inside: |
                      try:
                          ...
                      except (..., $EXC, ...) as $E:
                          ...
              - metavariable-pattern:
                  metavariable: $EXC
                  pattern-either:
                    - pattern: Exception
                    - pattern: BaseException
          - pattern-inside: |
              try:
                  ...
              except:
                  ...
      - pattern: config_write.$OP(...)
      # The mapper catches the rejection only when it runs the change: a lambda, not an eager call.
      - pattern-not-inside: "_run_config_change(..., lambda: ..., ...)"

  - id: subprocess-without-timeout
    languages: [python]
    severity: ERROR
    message: >-
      Pass timeout= to this subprocess call. Without a timeout, a child process that stops
      responding blocks the caller with no limit, and a test run or script hangs instead of failing.
    metadata:
      category: correctness
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: subprocess.run(...)
          - pattern: subprocess.call(...)
          - pattern: subprocess.check_call(...)
          - pattern: subprocess.check_output(...)
      - pattern-not: subprocess.$FUNCTION(..., timeout=$SECONDS, ...)

  - id: kea-http-call-outside-client
    languages: [python]
    severity: ERROR
    message: >-
      Send Kea HTTP requests through KeaClient.command(). It applies the TLS settings of the Server on
      each request and reports a missing TLS file as KeaTLSFileError, a RequestException. A request sent
      outside it lets the environment CA bundle replace those settings, and a missing TLS file escapes
      the RequestException handlers of the views as a plain OSError.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-http-call-outside-client.py"
      exclude:
        - "netbox_kea/kea.py"
        - "netbox_kea/tests/**"
    pattern-either:
      - pattern: requests.Session(...)
      - pattern: requests.session(...)
      - pattern: requests.get(...)
      - pattern: requests.post(...)
      - pattern: requests.put(...)
      - pattern: requests.patch(...)
      - pattern: requests.delete(...)
      - pattern: requests.head(...)
      - pattern: requests.request(...)

  - id: kea-mac-sync-write-without-savepoint
    languages: [python]
    severity: ERROR
    message: >-
      Run MAC lookup and save in event_scope.atomic() before catching their errors.
      A failed MAC write must not abort the caller's IPAM claim.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/sync.py"
        - "kea-mac-sync-write-without-savepoint.py"
    patterns:
      - pattern-inside: |
          def sync_mac_address(...):
              ...
      - pattern-either:
          - pattern: dcim.models.MACAddress.objects.get_or_create(...)
          - pattern: $MAC.save(...)
      - pattern-not-inside: |
          with event_scope.atomic(...):
              ...

  - id: kea-no-event-queue-internals
    languages: [python]
    severity: ERROR
    message: >-
      Do not use NetBox's event queue internals (events_queue, EventContext, enqueue_event).
      Open the transaction with event_scope.atomic(): NetBox then dispatches a unit's events
      after its COMMIT, and none when it rolls back.
      Limit: the rule matches the names as text, so a comment that names them also matches.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-no-event-queue-internals.py"
      exclude:
        - "**/tests/**"
    pattern-regex: \b(events_queue|EventContext|enqueue_event)\b

  - id: kea-raw-atomic
    languages: [python]
    severity: ERROR
    message: >-
      Open the transaction with event_scope.atomic(), not django.db.transaction.atomic.
      The owner decides whether the block is a unit that dispatches its events only after its COMMIT.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      include:
        - "netbox_kea/**"
        - "kea-raw-atomic.py"
      exclude:
        - "netbox_kea/event_scope.py"
        - "**/tests/**"
    pattern-either:
      - pattern: django.db.transaction.atomic
      - pattern: import django.db.transaction.atomic

  - id: kea-refusal-after-event-write
    languages: [python]
    severity: ERROR
    message: >-
      Raise the refusal before the first event-producing write of a caught event_scope.atomic() block.
      Inside a transaction the block is a savepoint, and NetBox dispatches the event of a write that it rolled back.
      Limit: writes and raises inside called helpers and callbacks are not seen.
    metadata:
      category: correctness
      confidence: MEDIUM
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-inside: |
          try:
              ...
          except ...:
              ...
      - pattern-inside: |
          with event_scope.atomic(...):
              ...
      - pattern-either:
          - pattern-inside: |
              $X.save(...)
              ...
          - pattern-inside: |
              $X.delete(...)
              ...
          - pattern-inside: |
              $Q.create(...)
              ...
          - pattern-inside: |
              $Q.get_or_create(...)
              ...
          - pattern-inside: |
              $Q.update_or_create(...)
              ...
          - pattern-inside: |
              $M.set(...)
              ...
          - pattern-inside: |
              $M.add(...)
              ...
          - pattern-inside: |
              $M.remove(...)
              ...
          - pattern-inside: |
              $M.clear()
              ...
      - pattern: raise ...

  - id: kea-dispatch-error-swallowed
    languages: [python]
    severity: ERROR
    message: >-
      Add "except event_scope.EventDispatchError: raise" before the broad handler of this try.
      The unit committed and its events did not dispatch, so the run must fail, not report a failed row.
      Limits: the handler order is not checked; a try with finally and handlers around callers of
      event_scope.atomic other than claim() and reconcile() are not seen.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-either:
          - pattern-inside: |
              try:
                  ...
              except Exception:
                  ...
          - pattern-inside: |
              try:
                  ...
              except Exception:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except Exception as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except Exception as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except BaseException as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...):
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...) as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., Exception, ...) as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...):
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...) as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., BaseException, ...) as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except RuntimeError as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...):
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...):
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...) as $ERR:
                  ...
          - pattern-inside: |
              try:
                  ...
              except (..., RuntimeError, ...) as $ERR:
                  ...
              else:
                  ...
          - pattern-inside: |
              try:
                  ...
              except:
                  ...
          - pattern-inside: |
              try:
                  ...
              except:
                  ...
              else:
                  ...
      - pattern-not-inside: |
          try:
              ...
          except event_scope.EventDispatchError:
              raise
      - pattern-not-inside: |
          try:
              ...
          except event_scope.EventDispatchError:
              raise
          else:
              ...
      - pattern-not-inside: |
          try:
              ...
          except event_scope.EventDispatchError:
              raise
          finally:
              ...
      - pattern-either:
          - pattern: event_scope.atomic(...)
          # Each claim and reconciliation row is an event_scope unit inside the call.
          - pattern: claim(...)
          - pattern: reconcile(...)

  - id: netbox-ipam-mutation-outside-reconciliation
    languages: [python]
    severity: ERROR
    message: >-
      Delete IPAddress, Prefix and IPRange rows and change their status only in
      netbox_kea/ipam_reconciliation.py. Reconciliation checks ownership and the
      upgrade barrier before it changes or removes an IPAM row.
    metadata:
      category: correctness
      confidence: HIGH
    paths:
      exclude:
        - "netbox_kea/ipam_reconciliation.py"
        - "**/tests/**"
        - "**/migrations/**"
    patterns:
      - pattern-either:
          - pattern: $OBJ.delete(...)
          - pattern: $OBJ.update(..., status=$STATUS, ...)
          - pattern: $OBJ.status = $STATUS
      - pattern-either:
          # Direct manager and queryset chains, including imported model aliases.
          - patterns:
              - pattern: $OBJ.$MEMBER
              - metavariable-pattern:
                  metavariable: $OBJ
                  pattern-either:
                    - pattern: <... ipam.models.IPAddress.objects ...>
                    - pattern: <... ipam.models.Prefix.objects ...>
                    - pattern: <... ipam.models.IPRange.objects ...>
          # A local variable bound to an IPAM query or object lookup.
          - patterns:
              - pattern-inside: |
                  $OBJ = $QUERY
                  ...
              - metavariable-pattern:
                  metavariable: $QUERY
                  pattern-either:
                    - pattern: <... ipam.models.IPAddress.objects ...>
                    - pattern: <... ipam.models.Prefix.objects ...>
                    - pattern: <... ipam.models.IPRange.objects ...>
                    - pattern: ipam.models.IPAddress(...)
                    - pattern: ipam.models.Prefix(...)
                    - pattern: ipam.models.IPRange(...)
          # Typed helper parameters, even when the import is under TYPE_CHECKING.
          - patterns:
              - pattern-inside: |
                  def $FUNCTION(..., $OBJ: $TYPE, ...):
                      ...
              - metavariable-pattern:
                  metavariable: $TYPE
                  pattern-either:
                    - pattern: ipam.models.IPAddress
                    - pattern: ipam.models.Prefix
                    - pattern: ipam.models.IPRange

  - id: kea-request-number-without-ascii-check
    languages: [python]
    severity: ERROR
    message: >-
      Parse a number from request text with parse_decimal() from netbox_kea.decimal_text.
      int(), str.isdigit() and a regex \d also accept other Unicode digits, and int() also
      accepts surrounding whitespace.
    paths:
      exclude:
        - "**/tests/**"
        - "**/migrations/**"
    pattern-either:
      - pattern: $TEXT.isdigit()
      - pattern: $TEXT.isdecimal()
      - pattern: $TEXT.isnumeric()
      - patterns:
          - pattern-either:
              - pattern: re.$FUNCTION("$REGEX", ...)
              - pattern: re.$FUNCTION(r"$REGEX", ...)
          - metavariable-regex:
              metavariable: $REGEX
              regex: \\d
      - patterns:
          - pattern-either:
              - pattern: int($PARAMS.get(...))
              - pattern: int($PARAMS[...])
              - pattern: int(<... $PARAMS.getlist(...) ...>)
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $VALUE = $PARAMS.get(...)
                          ...
                      - pattern-inside: |
                          $VALUE = $PARAMS[...]
                          ...
                  - pattern: int($VALUE)
          - metavariable-regex:
              metavariable: $PARAMS
              regex: ^((self\.)?request\.(GET|POST|query_params|data)|params|query_params|(self\.)?cleaned_data)$

  - id: kea-exception-handler-misses-runtime-error
    languages: [python]
    severity: ERROR
    message: >-
      This try catches KeaException or requests.RequestException but no clause
      catches RuntimeError. KeaClient.command() raises RuntimeError for a reply
      body that is not a JSON list, and check_response() for a malformed reply
      entry, for example ["ok"] from a proxy, so the request fails with HTTP 500.
      Add RuntimeError to the clause that reports the generic error. A try around
      server.get_client() alone catches ValueError only.
      Limits: a try with an else or finally clause is not checked, a RuntimeError
      caught by an outer try is not seen, and a subclass such as
      requests.ConnectionError or an aliased requests import is not matched. Suppress a true exception with
      `# nosemgrep: kea-exception-handler-misses-runtime-error`.
    metadata:
      category: correctness
      confidence: MEDIUM
      references:
        - "commit 8d7706c0: report a malformed Kea reply entry instead of failing with HTTP 500"
    paths:
      include:
        - "**/views/**"
        - "**/api/**"
        - "**/templatetags/**"
        - "**/forms.py"
        - "**/server_connection.py"
      exclude:
        - "**/tests/**"
    patterns:
      - pattern-either:
          - pattern: |
              try:
                  ...
              except KeaException:
                  ...
          - pattern: |
              try:
                  ...
              except KeaException as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., KeaException, ...):
                  ...
          - pattern: |
              try:
                  ...
              except (..., KeaException, ...) as $E:
                  ...
          - pattern: |
              try:
                  ...
              except requests.RequestException:
                  ...
          - pattern: |
              try:
                  ...
              except requests.RequestException as $E:
                  ...
          - pattern: |
              try:
                  ...
              except (..., requests.RequestException, ...):
                  ...
          - pattern: |
              try:
                  ...
              except (..., requests.RequestException, ...) as $E:
                  ...
      - pattern-not: |
          try:
              ...
          except RuntimeError:
              ...
      - pattern-not: |
          try:
              ...
          except RuntimeError as $E2:
              ...
      - pattern-not: |
          try:
              ...
          except (..., RuntimeError, ...):
              ...
      - pattern-not: |
          try:
              ...
          except (..., RuntimeError, ...) as $E2:
              ...
      - pattern-not: |
          try:
              ...
          except Exception:
              ...
      - pattern-not: |
          try:
              ...
          except Exception as $E2:
              ...
      - pattern-not: |
          try:
              ...
          except (..., Exception, ...):
              ...
      - pattern-not: |
          try:
              ...
          except (..., Exception, ...) as $E2:
              ...
      - pattern-not: |
          try:
              ...
          except BaseException:
              ...
      - pattern-not: |
          try:
              ...
          except BaseException as $E2:
              ...
      - pattern-not: |
          try:
              ...
          except (..., BaseException, ...):
              ...
      - pattern-not: |
          try:
              ...
          except (..., BaseException, ...) as $E2:
              ...
      - pattern-not: |
          try:
              ...
          except:
              ...
